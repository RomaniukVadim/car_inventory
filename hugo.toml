baseURL = "https://vadimromaniuk.github.io/car-inventory/"
locale = "uk-ua"
title = "Каталог доступності авто"
theme = "PaperMod"

[params]
  home_page_content_dir = "posts"
  env = "production"
  description = "Каталог доступності авто - сучасний інвентар"
  author = "Адмін"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowToc = true

  [params.profileMode]
    enabled = false
    title = "Каталог авто"
    imageUrl = "#"
    imageTitle = "Профіль"
    subtitle = "🚗 Швидко | ☁️ Прозоро | 🌙 Просто | 📱 Адаптивно"
    buttons = [
      { name = "Каталог", url = "/" },
      { name = "Про нас", url = "/about/" }
    ]

  [params.homeInfoParams]
    Title = "Наш інвентар"
    Content = "Ласкаво просимо до нашого каталогу! Тут ви можете знайти детальні характеристики, ціни та стан кожного авто.\n- Перегляньте деталі кожного автомобіля.\n- Виберіть ідеальний варіант для себе."

  [params.assets]
    disableHLJS = true

[languages.uk]
  languageName = "Українська"
  weight = 1
  lang = "uk"
  contentDir = "content"
  direction = "ltr"
  label = "Українська"

[outputs]
  home = ["HTML", "RSS", "JSON"]
