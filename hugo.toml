baseURL = "https://importcar.pp.ua"
locale = "uk-ua"
title = "Каталог доступності авто"
theme = "PaperMod"
publishDir = "docs"
paginate = 5
defaultContentLanguage = "uk"
enableRobotsTXT = true

[params]
  home_page_content_dir = "posts"
  env = "production"
  description = "Каталог доступності авто - сучасний інвентар"
  ShowShareButtons = false
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  ShowPageNums = true
  ShowToc = false


  [params.assets]
    disableHLJS = true

  [params.homeInfoParams]
Title = "Ваше авто: від пригону до ремонту"
Content = """
Допоможу знайти, привезти та привести до ладу автомобіль, який вам підходить. Працюю індивідуально, тому кожен клієнт — це особистий контроль.
- <b>Пригін авто</b>: Знаходжу та привожу авто з-за кордону за вашим запитом.
- <b>Технічний стан</b>: Ремонтую та підготую авто до експлуатації, щоб ви отримали надійний транспорт.
- <b>Авто в наявності</b>: Маю в наявності кілька перевірених варіантів, які можна розглянути вже зараз.
- <b>Чесний підхід</b>: Ви отримуєте пряму комунікацію з виконавцем без зайвих посередників та "корпоративних" націнок.
"""



[[menu.main]]
  identifier = "categories"
  name = "Контакт"
  url = "/contact/"
  weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
